name: logilight
title: LogiLight
base: core24
version: '0.1.3'
summary: RGB lighting control for Logitech G-series keyboards
description: |
  Set the colour, effect and speed of the RGB lighting on Logitech G-series
  keyboards, and choose whether it comes back after a reboot.
  LogiLight drives g810-led, the standard Linux controller for these keyboards.
  It replaces the usual sudo / udev-rule / systemd-service setup with a confined
  snap service that already runs with the access it needs, so nothing has to be
  installed on the host and no password is ever requested.

  Supported keyboards: G213, G410, G413, G512, G513, G610, G815, G810, G910,
  G Pro.  Mice are out of scope -- use Piper (apt install piper) for those.

  After installing, connect the hardware interface once:
    sudo snap connect logilight:raw-usb
grade: stable
confinement: strict
license: MIT
website: https://github.com/xpire/logilight
source-code: https://github.com/xpire/logilight
issues: https://github.com/xpire/logilight/issues

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]

apps:
  logilight:
    command: bin/logilight-gui
    extensions: [gnome]
    # No `desktop:` key: snapcraft picks up snap/gui/<app>.desktop automatically,
    # and an explicit path is resolved relative to snap/ rather than the project.

  logilight-daemon:
    command: bin/logilight-daemon
    daemon: simple
    restart-condition: on-failure
    # raw-usb satisfies the AppArmor half of device access; running as root
    # satisfies the Unix permission half.
    #
    # network-bind is not optional and is not about the device. snapd's base
    # seccomp profile allows `socket AF_UNIX` but NOT `bind`; bind/accept/listen
    # come from this interface. Without it the daemon dies at startup with
    # EPERM (errno 1) on bind(), which is near-impossible to diagnose from the
    # error alone. It auto-connects: its base declaration has no
    # deny-auto-connection.
    plugs:
      - raw-usb
      - network-bind

  logilight-cli:
    command: bin/logilight-cli

parts:
  g810-led:
    plugin: make
    source: https://github.com/MatMoul/g810-led.git
    # v0.4.3, unchanged upstream since 2022. Pinned so CI builds are reproducible.
    source-commit: efa3c35e74f01a2ed2346320da8bad411bfe8ed8
    build-packages:
      - g++
      - make
      - libusb-1.0-0-dev
    stage-packages:
      - libusb-1.0-0
    override-build: |
      set -e
      # g810-led 0.4.3 uses uint8_t/uint16_t throughout but never includes
      # <cstdint>. libstdc++ used to leak it in via <iostream>; since GCC 13 it
      # does not, so upstream no longer compiles on core24. One include each.
      for file in src/main.cpp src/helpers/*.h src/helpers/*.cpp src/classes/*.h src/classes/*.cpp; do
        sed -i '1i #include <cstdint>' "$file"
      done
      # LIB=libusb is mandatory in a snap: the default hidapi build writes to
      # /dev/hidraw*, which no connectable interface grants. libusb uses
      # /dev/bus/usb/*, which raw-usb does cover.
      make bin LIB=libusb
      install -Dm755 bin/g810-led "${CRAFT_PART_INSTALL}/usr/bin/g810-led"
      # g810-led selects the keyboard layout from argv[0]. Upstream's `make
      # setup` creates *absolute* /usr/bin links, which would resolve to the
      # host and be blocked; these must be relative.
      for name in g213 g410 g413 g512 g513 g610 g815 g910 gpro; do
        ln -sf g810-led "${CRAFT_PART_INSTALL}/usr/bin/${name}-led"
      done

  logilight:
    plugin: dump
    source: .
    # Only the Python package needs relocating. The launchers must stay in bin/
    # because apps.logilight*.command is resolved from $SNAP: organising bin/*
    # elsewhere would move them out from under the commands that use them.
    organize:
      logilight/*: lib/logilight/
    # Whitelist rather than blacklist: anything not listed here is dropped, and
    # a missing staged runtime file is a broken app, not a smaller snap.
    prime:
      - bin/**
      - lib/**
      - usr/**
    stage-packages:
      - python3-gi
